<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Management - Attendance System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="logo">AttendanceHub</a>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="team.html" class="active">Team</a>
        <a href="attendance.html">Attendance</a>
        <a href="reports.html">Reports</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Team Management</h1>
    <p class="text-muted mb-2">Add and manage your team members</p>

    <div id="alertMessage" style="display: none;"></div>

    <div class="card">
      <h2>Add Team Member</h2>
      <form id="teamForm">
        <div class="form-group">
          <label for="memberName">Full Name *</label>
          <input type="text" id="memberName" placeholder="Enter member name" required>
        </div>

        <div class="form-group">
          <label for="memberRole">Role *</label>
          <input type="text" id="memberRole" placeholder="e.g., Developer, Designer, Manager" required>
        </div>

        <div class="form-group">
          <label for="shiftStart">Shift Start Time *</label>
          <input type="time" id="shiftStart" required>
        </div>

        <div class="form-group">
          <label for="shiftEnd">Shift End Time *</label>
          <input type="time" id="shiftEnd" required>
        </div>

        <button type="submit" class="btn btn-primary">
          Add Member
        </button>
      </form>
    </div>

    <div class="card">
      <h2>Team Members</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Shift Start</th>
              <th>Shift End</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="teamTableBody">
            <tr>
              <td colspan="5" class="text-center">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/team.js"></script>
</body>
</html>
