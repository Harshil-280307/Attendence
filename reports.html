<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Attendance System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="logo">AttendanceHub</a>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="team.html">Team</a>
        <a href="attendance.html">Attendance</a>
        <a href="reports.html" class="active">Reports</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Attendance Reports</h1>
    <p class="text-muted mb-2">View daily and monthly attendance reports</p>

    <div class="card">
      <h2>Daily Report</h2>
      <p class="text-muted mb-2">View attendance for a specific date</p>
      
      <div id="dailyAlert" style="display: none;"></div>

      <div style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 1.5rem;">
        <div class="form-group mb-0" style="flex: 1; min-width: 200px;">
          <label for="dailyDate">Select Date</label>
          <input type="date" id="dailyDate">
        </div>
        <button id="generateDailyBtn" class="btn btn-primary">
          Generate Report
        </button>
      </div>

      <div id="dailyReport"></div>
    </div>

    <div class="card">
      <h2>Monthly Report</h2>
      <p class="text-muted mb-2">View attendance summary for a month</p>
      
      <div id="monthlyAlert" style="display: none;"></div>

      <div style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 1.5rem;">
        <div class="form-group mb-0" style="flex: 1; min-width: 200px;">
          <label for="monthlyMonth">Select Month</label>
          <input type="month" id="monthlyMonth">
        </div>
        <button id="generateMonthlyBtn" class="btn btn-primary">
          Generate Report
        </button>
      </div>

      <div id="monthlyReport"></div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
